server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA-friendly fallback — publisher-site is technically single-page
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Static assets: long cache
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Cloud Run / LB health probe
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
